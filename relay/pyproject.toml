[project]
name = "arkit-fbt-relay"
version = "0.1.0"
description = "iPhone ARKit body tracking -> VRChat OSC trackers relay"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "python-osc>=1.8",
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13.7",
    "zeroconf>=0.131",
]

[project.scripts]
arkit-fbt-relay = "arkit_fbt_relay.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkit_fbt_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
