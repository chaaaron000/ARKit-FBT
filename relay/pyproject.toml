[project]
name = "arkit-fbt-relay"
version = "0.1.0"
description = "iPhone ARKit body tracking -> VRChat OSC trackers relay"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "python-osc>=1.8",
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13.7",
    "zeroconf>=0.131",
]

[project.scripts]
arkit-fbt-relay = "arkit_fbt_relay.__main__:main"

[tool.uv]
# 설치된 Python을 우선 쓴다. uv가 받은 Python은 경로가 바뀔 때마다
# Windows 방화벽 허용을 다시 받아야 하므로, 이미 허용된 시스템 Python이 편하다.
python-preference = "system"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arkit_fbt_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
