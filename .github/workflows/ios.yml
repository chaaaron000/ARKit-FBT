name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild -quiet \
            -project ARKitFBT.xcodeproj \
            -target ARKitFBT \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          cd ios/build/Release-iphoneos
          rm -rf Payload
          mkdir Payload
          cp -R ARKitFBT.app Payload/
          zip -qry ../../ARKitFBT.ipa Payload
          ls -la ../../ARKitFBT.ipa

      - uses: actions/upload-artifact@v5
        with:
          name: ARKitFBT-ipa
          path: ios/ARKitFBT.ipa

      - name: Publish rolling release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="서명되지 않은 IPA입니다. Sideloadly로 설치하세요. 빌드 커밋: ${GITHUB_SHA::7}"
          if ! gh release view ios-latest >/dev/null 2>&1; then
            gh release create ios-latest --prerelease --title "iOS 최신 빌드" --notes "$NOTES"
          else
            gh release edit ios-latest --notes "$NOTES"
          fi
          gh release upload ios-latest ios/ARKitFBT.ipa --clobber
