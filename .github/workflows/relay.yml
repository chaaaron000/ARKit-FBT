name: Relay tests

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "relay/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
